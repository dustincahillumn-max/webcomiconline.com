'use strict';
/*
CHAOS HOUSE — BUILD 0.2 DESIGN CONTRACT
1. Main mansion is a readable 2D elevation.
2. Ordinary doors show truthful live raycast previews.
3. Raycast rooms can contain inspection scenes, detached 2D spaces, tunnels and mirrors.
4. State persists between visits.
5. Hall enemies follow deterministic routes and reconstruct only while the grid is online.
6. Random anomaly effects are bounded and reversible.
7. Objective audio never intentionally points down a false path.
8. Remote media loads lazily and fails to visual fallbacks.
9. Full Monitor reward unlocks permanently after completion.
10. Scene transitions never render cleared scene state.

function drawSide(){x.fillStyle='#151914';x.fillRect(0,0,W,H);let cx=G.cameraX;for(let f=0;f<4;f++){let y=floorY[f];x.fillStyle=f===0?'#55564e':'#72745b';x.fillRect(mansion.left-cx,y,mansion.right-mansion.left,8);x.fillStyle='#303329';x.fillRect(mansion.left-cx,y+8,mansion.right-mansion.left,5)}for(let f=1;f<4;f++)for(let q=100;q<1730;q+=86){x.fillStyle=((q/86+f)|0)%3===0?'#788116':'#242b20';x.fillRect(q-cx,floorY[f]-51,29,31)}for(const d of doors){let xx=d.x-cx,yy=floorY[d.floor]-48;if(xx<-60||xx>W+60)continue;x.fillStyle='#161912';x.fillRect(xx-17,yy,34,48);x.strokeStyle=d.locked()?'#7b392d':'#b39d28';x.strokeRect(xx-18,yy-1,36,49);if(d.state>0&&!d.locked()){let r=rooms[d.room];raycast(px,96,72,r,{...r.spawn},true);x.save();x.beginPath();let op=d.state===1?8:30;x.rect(xx-op/2,yy+4,op,40);x.clip();x.drawImage(preview,xx-20,yy+1,40,46);x.restore()}else{x.fillStyle=d.locked()?'#39211c':'#373728';x.fillRect(xx-15,yy+2,30,45)}if(Math.abs(G.player.x-d.x)<45&&G.player.floor===d.floor){x.fillStyle='#ede29b';x.font='8px monospace';x.textAlign='center';x.fillText(d.locked()?'LOCKED':d.state===2?'ENTER ↑':'E: DOOR',xx,yy-6)}}for(const e of enemies)if(e.alive){let xx=e.x-cx,yy=floorY[e.floor];x.fillStyle=e.name==='BIO-SENTRY'?'#8d5d46':'#a4a03d';x.fillRect(xx-8,yy-25,16,22)}let p=G.player;x.fillStyle='#c9d4bc';x.fillRect(p.x-cx-6,floorY[p.floor]-27,12,23);x.fillStyle='#0a0c09cc';x.fillRect(7,7,190,30);x.strokeStyle='#58613b';x.strokeRect(7,7,190,30);x.fillStyle='#d6ca65';x.font='10px monospace';x.fillText(floorNames[p.floor],15,20);x.fillStyle='#8e9662';x.fillText(`X ${Math.floor(p.x)} · GRID ${G.flags.gridOff?'OFFLINE':'ONLINE'}`,15,31);hud();if(G.map)drawMap()}
function drawRoom(){if(!G.currentDoor||!rooms[G.scene])return;let r=rooms[G.scene];raycast(x,W,H,r,G.cam,false);let im=imgs[r.art];if(im.complete){x.globalAlpha=.12;x.drawImage(im,0,0,W,H);x.globalAlpha=1}x.fillStyle='#080a08dd';x.fillRect(7,7,280,31);x.strokeStyle='#60633c';x.strokeRect(7,7,280,31);x.fillStyle='#d8cc6e';x.font='10px monospace';x.fillText(r.name,15,20);x.fillStyle='#8f9566';x.fillText('F SEARCH/USE · ESC/BACKSPACE EXIT',15,32);if(Math.hypot(G.cam.x-r.spawn.x,G.cam.y-r.spawn.y)<1.15){x.fillStyle='#080a08e8';x.fillRect(W/2-85,H-54,170,24);x.strokeStyle='#98934d';x.strokeRect(W/2-85,H-54,170,24);x.fillStyle='#e5d77b';x.textAlign='center';x.fillText('F: BACK TO HALL',W/2,H-39);x.textAlign='left'}hud()}
function drawPocket(){x.fillStyle='#020303';x.fillRect(0,0,W,H);try{x.globalAlpha=.75;x.drawImage(voidVideo,0,0,W,H);x.globalAlpha=1}catch{}x.fillStyle='#080b08bb';x.fillRect(0,0,W,H);for(let i=0;i<18;i++){x.strokeStyle=`rgba(200,220,170,${.08+((i*17)%8)/50})`;x.strokeRect(i*38-G.t*12%38,120+(i%4)*22,80,85)}x.fillStyle='#676d55';x.fillRect(22,308,596,8);x.fillStyle='#d5dac9';x.fillRect(G.player.x-6,281,12,27);x.fillStyle='#e3d45c';x.font='10px monospace';x.fillText('MIRROR NEGATIVE SPACE · WALK RIGHT TO THE REMOTE EXIT · ESC RETURNS',12,18);hud()}
function drawInspect(){x.fillStyle='#000';x.fillRect(0,0,W,H);let im=imgs[G.scene];if(im?.complete)x.drawImage(im,0,0,W,H);x.fillStyle='#000b';x.fillRect(0,H-58,W,58);x.fillStyle='#eee3a3';x.font='10px monospace';x.fillText(G.msg,14,H-35);x.fillText('F / ESC — RETURN',14,H-18)}
function hud(){let p=G.player;x.fillStyle='#070907dd';x.fillRect(7,H-31,245,24);x.strokeStyle='#4c5432';x.strokeRect(7,H-31,245,24);x.fillStyle='#bfc383';x.font='9px monospace';x.fillText('BODY',14,H-17);for(let i=0;i<p.max;i++){x.fillStyle=i<p.hp?'#b7a438':'#292c23';x.fillRect(48+i*12,H-24,8,10)}x.fillStyle='#bfc383';x.fillText('STUN',121,H-17);x.fillStyle='#2b2f25';x.fillRect(158,H-23,78,9);x.fillStyle='#a5b74d';x.fillRect(159,H-22,76*p.weapon,7);if(G.t<G.msgUntil){let text=G.msg,mw=Math.min(W-30,x.measureText(text).width+24);x.fillStyle='#050705ed';x.fillRect((W-mw)/2,44,mw,28);x.strokeStyle='#9f9238';x.strokeRect((W-mw)/2,44,mw,28);x.fillStyle='#e7dc92';x.textAlign='center';x.fillText(text,W/2,61);x.textAlign='left'}}
function drawMap(){x.fillStyle='#040604f2';x.fillRect(30,24,W-60,H-48);x.strokeStyle='#8e8133';x.strokeRect(30,24,W-60,H-48);x.fillStyle='#d9ce75';x.font='11px monospace';x.fillText('HOUSE ELEVATION / ACCESS MAP',50,48);let sx=.29,ox=50,oy=320;for(let f=0;f<4;f++){let y=oy-f*58;x.strokeStyle='#5f6346';x.beginPath();x.moveTo(ox,y);x.lineTo(ox+(mansion.right-mansion.left)*sx,y);x.stroke()}for(const d of doors){let xx=ox+(d.x-mansion.left)*sx,y=oy-d.floor*58;x.fillStyle=d.locked()?'#803d31':d.state===2?'#cfc05b':'#737647';x.fillRect(xx-2,y-10,5,10)}}
function unlockReward(){let u=localStorage.getItem(unlockKey)==='1';let h=document.getElementById('rewardHotspot');h.classList.toggle('unlocked',u);h.querySelector('span').textContent=u?'REWARD UNLOCKED — REALITY AWAITS':'REWARD LOCKED'}
unlockReward();document.getElementById('rewardHotspot').onclick=()=>{if(localStorage.getItem(unlockKey)==='1'){document.getElementById('rewardViewer').classList.add('show');document.querySelector('#rewardViewer video').play().catch(()=>{})}else say('THE MONITOR HAS NOT ACCEPTED YOU')};document.getElementById('closeReward').onclick=()=>{let v=document.querySelector('#rewardViewer video');v.pause();document.getElementById('rewardViewer').classList.remove('show')};
let last=performance.now();function frame(now){let dt=Math.min(.033,(now-last)/1000);last=now;G.t+=dt;if(G.effects.until<=G.t){G.effects.fov=1;G.effects.audioWarp=1}try{if(G.mode==='title'){if(pressed.enter||pressed[' ']){AudioSys.init();voidVideo.play().catch(()=>{});transition('side','mansion',{message:'INVESTIGATE THE STUDY. EVERY ROOM HAS A WAY BACK.'})}drawTitle()}else if(G.mode==='side'){updateSide(dt);if(G.mode==='side')drawSide()}else if(G.mode==='room'){updateRoom(dt);if(G.mode==='room')drawRoom()}else if(G.mode==='pocket'){updatePocket(dt);if(G.mode==='pocket')drawPocket()}else if(G.mode==='inspect'){if(pressed.f||pressed.escape||pressed.backspace)leaveInspect();if(G.mode==='inspect')drawInspect()}}catch(e){G.error=String(e.stack||e);safeHall('SCENE ERROR — RECOVERED TO HALL');drawSide()}if(G.error){x.fillStyle='#300d0ddd';x.fillRect(8,76,624,45);x.fillStyle='#ffb2a8';x.font='8px monospace';x.fillText('DEBUG: '+G.error.slice(0,115),14,92)}for(const k in pressed)delete pressed[k];requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
